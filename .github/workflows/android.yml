name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validation gate
        run: node scripts/validate-project.js
      - name: Unit tests (17 suites)
        run: node tests/run-all.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (www/)
        run: npm run build

      # The Android project is generated here on CI and never committed:
      # the repository stays free of Gradle/Kotlin/Java sources.
      - name: Create Capacitor Android project (temporary, CI only)
        run: npx cap add android

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify build output
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size:"
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename artifacts
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/LingoStep-v10.0.0-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoStep-debug-apk
          path: apks/LingoStep-v10.0.0-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.0.0
          name: LingoStep v10.0.0
          body: |
            LingoStep v10.0.0 — premium mobile redesign, Android app build.

            ## Install
            1. Download **LingoStep-v10.0.0-debug.apk** below.
            2. On your phone, allow "Install unknown apps" for your browser/file manager.
            3. Open the APK and install.

            252 lessons, 14,035 exercises — all preserved. Works offline.
          files: |
            apks/LingoStep-v10.0.0-debug.apk
